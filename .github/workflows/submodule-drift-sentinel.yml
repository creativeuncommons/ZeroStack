name: Upstream Submodule Drift Sentinel

on:
  schedule:
    # Run daily at 02:00 UTC to catch upstream package changes
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift-sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZeroStack
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Submodules & Audit Drift Gate
        run: |
          chmod +x scripts/submodule-sync scripts/zerostack-check
          python3 scripts/submodule-sync
          if [ -n "$(git status --porcelain packages/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add packages/
            git commit -m "chore(submodules): auto-sync upstream packages with verified drift gate"
            git push origin main
          fi
