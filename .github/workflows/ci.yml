name: ZeroStack CI Conformance Sentinel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout ZeroStack with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run ZeroStack Release Gatekeeper Audit
        run: |
          chmod +x scripts/zerostack-check
          python3 scripts/zerostack-check --audit
